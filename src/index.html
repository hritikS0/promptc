<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Slither Meme Royale 🚀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-gradient: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 60%, #030712 100%);
            --card-bg: rgba(18, 24, 40, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --score-bg: rgba(15, 23, 42, 0.7);
            --score-border: rgba(255, 255, 255, 0.08);
            --badge-bg: rgba(0, 0, 0, 0.3);
            --overlay-bg: rgba(9, 13, 22, 0.85);
            --overlay-text: #cbd5e1;
            --control-bg: rgba(255, 255, 255, 0.06);
            --control-border: rgba(255, 255, 255, 0.1);
            --control-hover: rgba(255, 255, 255, 0.15);
            --dpad-bg: rgba(255, 255, 255, 0.08);
            --dpad-border: rgba(255, 255, 255, 0.15);
            --accent-green: #10b981;
            --accent-neon: #a855f7;
            --accent-pink: #ec4899;
            --accent-yellow: #f59e0b;
            --accent-cyan: #06b6d4;
            --text-light: #f8fafc;
            --text-sub: #94a3b8;
            --font-head: 'Outfit', sans-serif;
            --font-pixel: 'Press Start 2P', monospace;
        }

        body.light-mode {
            --bg-gradient: radial-gradient(circle at center, #f0fdf4 0%, #e0f2fe 60%, #cbd5e1 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(148, 163, 184, 0.35);
            --score-bg: rgba(241, 245, 249, 0.9);
            --score-border: rgba(148, 163, 184, 0.25);
            --badge-bg: rgba(226, 232, 240, 0.85);
            --overlay-bg: rgba(255, 255, 255, 0.92);
            --overlay-text: #334155;
            --control-bg: rgba(15, 23, 42, 0.06);
            --control-border: rgba(15, 23, 42, 0.15);
            --control-hover: rgba(15, 23, 42, 0.12);
            --dpad-bg: rgba(15, 23, 42, 0.08);
            --dpad-border: rgba(15, 23, 42, 0.2);
            --text-light: #0f172a;
            --text-sub: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            color: var(--text-light);
            font-family: var(--font-head);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .game-wrapper {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        0 0 50px rgba(168, 85, 247, 0.2);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .title-container h1 {
            font-family: var(--font-head);
            font-weight: 900;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #38bdf8 0%, #a855f7 50%, #f43f5e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .title-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .score-board {
            display: flex;
            gap: 12px;
        }

        .score-box {
            background: var(--score-bg);
            border: 1px solid var(--score-border);
            border-radius: 12px;
            padding: 6px 12px;
            text-align: center;
            min-width: 70px;
            transition: background 0.3s, border 0.3s;
        }

        .score-label {
            font-size: 0.65rem;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 700;
        }

        .score-val {
            font-family: var(--font-pixel);
            font-size: 0.9rem;
            color: #38bdf8;
            margin-top: 2px;
        }

        .score-box.high .score-val {
            color: #f59e0b;
        }

        .badge-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--badge-bg);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            transition: background 0.3s;
        }

        .meme-rank {
            color: #a855f7;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .combo-tag {
            background: linear-gradient(90deg, #ec4899, #8b5cf6);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #fff;
            font-family: var(--font-pixel);
            display: none;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.08); }
        }

        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(168, 85, 247, 0.4);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 20px rgba(168, 85, 247, 0.2);
            background: #050811;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Overlay Screens */
        .overlay {
            position: absolute;
            inset: 0;
            background: var(--overlay-bg);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s ease, background 0.3s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .meme-emoji {
            font-size: 3.5rem;
            animation: bounce 1s infinite alternate cubic-bezier(0.5, 0.05, 0.1, 0.3);
        }

        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-10px) scale(1.1); }
        }

        .overlay h2 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #f43f5e, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .overlay p {
            font-size: 0.9rem;
            color: var(--overlay-text);
            max-width: 300px;
            line-height: 1.4;
        }

        .meme-quote {
            font-family: var(--font-pixel);
            font-size: 0.75rem;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            border: 1px dashed #f59e0b;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .btn-start {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 1.1rem;
            padding: 12px 32px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(16, 185, 129, 0.6);
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* Controls Section */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .btn-control {
            background: var(--control-bg);
            border: 1px solid var(--control-border);
            color: var(--text-light);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-control:hover {
            background: var(--control-hover);
            color: var(--text-light);
        }

        /* Mobile D-Pad Grid */
        .dpad-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 220px;
            margin: 0 auto;
        }

        .dpad-btn {
            background: var(--dpad-bg);
            border: 1px solid var(--dpad-border);
            color: var(--text-light);
            height: 52px;
            border-radius: 14px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }

        .dpad-btn:active {
            background: rgba(168, 85, 247, 0.4);
            transform: scale(0.92);
        }

        .dpad-empty {
            visibility: hidden;
        }

        @media (min-width: 600px) {
            .dpad-container {
                display: none; /* Hide D-pad on desktop screens */
            }
        }
    </style>
</head>

<body>
    <div class="game-wrapper">
        <header>
            <div class="title-container">
                <h1>🐍 SLITHER MEME 🚀</h1>
                <div class="title-sub">ROYALE EDITION</div>
            </div>
            <div class="score-board">
                <div class="score-box">
                    <div class="score-label">Score</div>
                    <div id="score" class="score-val">0</div>
                </div>
                <div class="score-box high">
                    <div class="score-label">Best</div>
                    <div id="high-score" class="score-val">0</div>
                </div>
            </div>
        </header>

        <div class="badge-bar">
            <div id="meme-rank" class="meme-rank">🗿 NOOB SLITHER</div>
            <div id="combo-tag" class="combo-tag">2x COMBO!</div>
        </div>

        <div class="canvas-container">
            <canvas id="game-canvas" width="600" height="600"></canvas>
            
            <!-- Start Overlay -->
            <div id="start-overlay" class="overlay">
                <div class="meme-emoji">🐍</div>
                <h2>MUCH SNAKE WOW</h2>
                <p>Eat pizza 🍕, rockets 🚀 & diamonds 💎 to go to the moon!</p>
                <div class="meme-quote">Use Arrow Keys / WASD or D-Pad</div>
                <button id="start-btn" class="btn-start">START SLITHERING 🚀</button>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameover-overlay" class="overlay hidden">
                <div id="go-emoji" class="meme-emoji">💀</div>
                <h2>GAME OVER BRO</h2>
                <div id="go-quote" class="meme-quote">WAS NOT VERY CASH MONEY OF YOU</div>
                <p>Final Score: <strong id="final-score" style="color: #38bdf8;">0</strong></p>
                <button id="restart-btn" class="btn-start">RESTART GAME 🔄</button>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <button id="pause-btn" class="btn-control">⏸️ Pause</button>
            <button id="sound-btn" class="btn-control">🔊 Sound: ON</button>
            <button id="theme-btn" class="btn-control">🌙 Mode: Dark</button>
        </div>

        <!-- Mobile Touch D-Pad -->
        <div class="dpad-container">
            <div class="dpad-empty"></div>
            <button id="btn-up" class="dpad-btn" aria-label="Up">▲</button>
            <div class="dpad-empty"></div>
            <button id="btn-left" class="dpad-btn" aria-label="Left">◀</button>
            <button id="btn-down" class="dpad-btn" aria-label="Down">▼</button>
            <button id="btn-right" class="dpad-btn" aria-label="Right">▶</button>
        </div>
    </div>

    <script>
        // Game Constants
        const GRID_SIZE = 25;
        const TILE_COUNT = 24;
        const CANVAS_SIZE = 600;

        // Sound Effects via Web Audio API
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playEat() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            playSpecial() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(587.33, this.ctx.currentTime); // D5
                osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08); // A5
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }

            playGameOver() {
                if (!this.enabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        const soundFX = new SoundFX();

        // Game State Variables
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        let snake = [];
        let velocity = { x: 0, y: 0 };
        let nextVelocity = { x: 0, y: 0 };
        let food = { x: 10, y: 10, type: '🍕', points: 10 };
        let score = 0;
        let highScore = localStorage.getItem('slither_meme_high') || 0;
        let comboStreak = 0;
        let lastEatTime = 0;
        let gameInterval = null;
        let isPaused = false;
        let isRunning = false;
        let particles = [];
        let floatingTexts = [];

        document.getElementById('high-score').innerText = highScore;

        // Meme Food Items Config
        const FOOD_TYPES = [
            { icon: '🍕', pts: 10, prob: 0.4 },
            { icon: '🍔', pts: 15, prob: 0.25 },
            { icon: '🌮', pts: 20, prob: 0.15 },
            { icon: '💎', pts: 50, prob: 0.1 },
            { icon: '🚀', pts: 100, prob: 0.06 },
            { icon: '🐶', pts: 40, prob: 0.04 }
        ];

        const MEME_QUOTES_GO = [
            "WAS NOT VERY CASH MONEY OF YOU 💀",
            "SKILL ISSUE BRO 🤡",
            "FEELS BAD MAN 🐸",
            "DIAMOND HANDS SLIPPED 💎🙌",
            "SYSTEM REBOOT NEEDED 🤖",
            "MUCH SAD, VERY RESTART 🐶"
        ];

        const MEME_RANKS = [
            { threshold: 0, rank: '🗿 NOOB SLITHER' },
            { threshold: 50, rank: '🍕 PIZZA CHAD' },
            { threshold: 150, rank: '💎 HODL SNAKE' },
            { threshold: 300, rank: '🚀 DOGE MOON WALKER' },
            { threshold: 500, rank: '🐸 PEPE GOD SLITHER' }
        ];

        // Init Game
        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 10, y: 11 },
                { x: 10, y: 12 }
            ];
            velocity = { x: 0, y: -1 };
            nextVelocity = { x: 0, y: -1 };
            score = 0;
            comboStreak = 0;
            particles = [];
            floatingTexts = [];
            spawnFood();
            updateScoreUI();
        }

        function startGame() {
            soundFX.init();
            initGame();
            isRunning = true;
            isPaused = false;
            document.getElementById('start-overlay').classList.add('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 110);
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                const rx = Math.floor(Math.random() * TILE_COUNT);
                const ry = Math.floor(Math.random() * TILE_COUNT);
                
                valid = !snake.some(segment => segment.x === rx && segment.y === ry);
                if (valid) {
                    const r = Math.random();
                    let cumulative = 0;
                    let selected = FOOD_TYPES[0];
                    for (const item of FOOD_TYPES) {
                        cumulative += item.prob;
                        if (r <= cumulative) {
                            selected = item;
                            break;
                        }
                    }
                    food = { x: rx, y: ry, icon: selected.icon, points: selected.pts };
                }
            }
        }

        // Main Game Loop
        function gameLoop() {
            if (isPaused || !isRunning) return;

            // Update Direction
            velocity = { ...nextVelocity };

            // Move Head
            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // Wall Collision Check (Wrap Around or Border Die - let's do wall collide for true arcade challenge)
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // Self Collision Check
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Eat Food Check
            if (head.x === food.x && head.y === food.y) {
                const now = Date.now();
                if (now - lastEatTime < 2500) {
                    comboStreak++;
                } else {
                    comboStreak = 1;
                }
                lastEatTime = now;

                const comboMultiplier = comboStreak > 1 ? Math.min(comboStreak, 5) : 1;
                const earned = food.points * comboMultiplier;
                score += earned;

                if (food.points >= 50) {
                    soundFX.playSpecial();
                } else {
                    soundFX.playEat();
                }

                // Add Particles & Floating Text
                createParticleBurst(food.x * GRID_SIZE + 10, food.y * GRID_SIZE + 10);
                addFloatingText(`+${earned} ${comboStreak > 1 ? `(${comboMultiplier}x!)` : ''}`, food.x * GRID_SIZE, food.y * GRID_SIZE);

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('slither_meme_high', highScore);
                }

                updateScoreUI();
                spawnFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }

            render();
        }

        function updateScoreUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('high-score').innerText = highScore;

            // Update Rank
            let currentRank = MEME_RANKS[0].rank;
            for (const r of MEME_RANKS) {
                if (score >= r.threshold) currentRank = r.rank;
            }
            document.getElementById('meme-rank').innerText = currentRank;

            // Combo Tag
            const comboTag = document.getElementById('combo-tag');
            if (comboStreak > 1) {
                comboTag.style.display = 'inline-block';
                comboTag.innerText = `${comboStreak}x COMBO 🔥`;
            } else {
                comboTag.style.display = 'none';
            }
        }

        // Particle System
        function createParticleBurst(x, y) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1,
                    color: ['#38bdf8', '#a855f7', '#ec4899', '#f59e0b', '#10b981'][Math.floor(Math.random() * 5)]
                });
            }
        }

        function addFloatingText(str, x, y) {
            floatingTexts.push({
                text: str,
                x: x,
                y: y,
                life: 1,
                vy: -1.5
            });
        }

        // Render Canvas
        function render() {
            const isLight = document.body.classList.contains('light-mode');

            // Background Grid
            ctx.fillStyle = isLight ? '#f8fafc' : '#050811';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw subtle glowing grid lines
            ctx.strokeStyle = isLight ? 'rgba(168, 85, 247, 0.15)' : 'rgba(168, 85, 247, 0.06)';
            ctx.lineWidth = 1;
            for (let i = 0; i < CANVAS_SIZE; i += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, CANVAS_SIZE);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(CANVAS_SIZE, i);
                ctx.stroke();
            }

            // Draw Food
            ctx.font = '20px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(food.icon, food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2);

            // Draw Snake Segments
            snake.forEach((segment, index) => {
                const px = segment.x * GRID_SIZE;
                const py = segment.y * GRID_SIZE;

                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#a855f7';
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.roundRect(px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2, 8);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Eyes
                    const eyeOffset = GRID_SIZE * 0.3;
                    const eyeRadius = GRID_SIZE * 0.14;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(px + eyeOffset, py + eyeOffset, eyeRadius, 0, Math.PI * 2);
                    ctx.arc(px + GRID_SIZE - eyeOffset, py + eyeOffset, eyeRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#090d16';
                    ctx.beginPath();
                    ctx.arc(px + eyeOffset, py + eyeOffset, eyeRadius * 0.5, 0, Math.PI * 2);
                    ctx.arc(px + GRID_SIZE - eyeOffset, py + eyeOffset, eyeRadius * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Body Gradient
                    const ratio = index / snake.length;
                    ctx.fillStyle = `hsl(${270 + ratio * 60}, 90%, ${65 - ratio * 20}%)`;
                    ctx.beginPath();
                    ctx.roundRect(px + 2, py + 2, GRID_SIZE - 4, GRID_SIZE - 4, 5);
                    ctx.fill();
                }
            });

            // Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }

            // Update & Draw Floating Text
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.life -= 0.03;

                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                    continue;
                }

                ctx.font = 'bold 12px var(--font-head)';
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 4;
                ctx.globalAlpha = ft.life;
                ctx.fillText(ft.text, ft.x + 10, ft.y);
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameInterval);
            soundFX.playGameOver();

            const randomQuote = MEME_QUOTES_GO[Math.floor(Math.random() * MEME_QUOTES_GO.length)];
            document.getElementById('go-quote').innerText = randomQuote;
            document.getElementById('final-score').innerText = score;
            document.getElementById('gameover-overlay').classList.remove('hidden');
        }

        // Direction Helpers
        function changeDirection(dir) {
            if (!isRunning || isPaused) return;

            switch (dir) {
                case 'UP':
                    if (velocity.y !== 1) nextVelocity = { x: 0, y: -1 };
                    break;
                case 'DOWN':
                    if (velocity.y !== -1) nextVelocity = { x: 0, y: 1 };
                    break;
                case 'LEFT':
                    if (velocity.x !== 1) nextVelocity = { x: -1, y: 0 };
                    break;
                case 'RIGHT':
                    if (velocity.x !== -1) nextVelocity = { x: 1, y: 0 };
                    break;
            }
        }

        // Key Listeners
        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault(); // Prevent page scroll
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('UP');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('DOWN');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('LEFT');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('RIGHT');
                    break;
                case ' ':
                    togglePause();
                    break;
            }
        });

        // Touch D-Pad listeners
        document.getElementById('btn-up').addEventListener('click', () => changeDirection('UP'));
        document.getElementById('btn-down').addEventListener('click', () => changeDirection('DOWN'));
        document.getElementById('btn-left').addEventListener('click', () => changeDirection('LEFT'));
        document.getElementById('btn-right').addEventListener('click', () => changeDirection('RIGHT'));

        // Swipe Gesture Support on Canvas
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].screenX - touchStartX;
            const dy = e.changedTouches[0].screenY - touchStartY;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) changeDirection('RIGHT');
                else if (dx < -30) changeDirection('LEFT');
            } else {
                if (dy > 30) changeDirection('DOWN');
                else if (dy < -30) changeDirection('UP');
            }
        }, { passive: true });

        // Pause Toggle
        function togglePause() {
            if (!isRunning) return;
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? '▶️ Resume' : '⏸️ Pause';
        }

        document.getElementById('pause-btn').addEventListener('click', togglePause);

        // Sound Toggle
        document.getElementById('sound-btn').addEventListener('click', () => {
            soundFX.enabled = !soundFX.enabled;
            document.getElementById('sound-btn').innerText = soundFX.enabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
        });

        // Theme Toggle Logic
        const themeBtn = document.getElementById('theme-btn');
        
        function setTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-mode');
                if (themeBtn) themeBtn.innerText = '☀️ Mode: Light';
                localStorage.setItem('slither_theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                if (themeBtn) themeBtn.innerText = '🌙 Mode: Dark';
                localStorage.setItem('slither_theme', 'dark');
            }
            if (isRunning) render();
        }

        function toggleTheme() {
            const isLight = document.body.classList.contains('light-mode');
            setTheme(isLight ? 'dark' : 'light');
        }

        const savedTheme = localStorage.getItem('slither_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        setTheme(savedTheme);

        if (themeBtn) {
            themeBtn.addEventListener('click', toggleTheme);
        }

        // Start & Restart Listeners
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        // Auto start game when opened in browser
        window.addEventListener('DOMContentLoaded', () => {
            startGame();
        });
    </script>
</body>
